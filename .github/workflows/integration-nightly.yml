# Nightly integration sweeps against four connectedhomeip example apps, all
# built at CHIP_REF (v1.4.2.0): all-clusters-app (`just integration`),
# lit-icd-app (`just integration-icd`), ota-requestor-app
# (`just integration-ota`) and tv-app (`just integration-tv`).
#
# NOT a per-PR check (by design — the connectedhomeip build is multi-GB and
# multi-minute; the per-PR gate stays fast). Runs on a nightly schedule and on
# manual dispatch. Drives the same `just integration*` recipes as the local
# harness, so CI and local cannot drift.
#
# Validated on a GitHub Ubuntu runner 2026-07-03 (run 28670513815): full build +
# DUT sweep green end to end. If the runner image changes and the build breaks,
# tune the apt deps / bootstrap steps (the ot-commissioner build needs
# libevent-dev; mDNS needs libavahi-client-dev).
name: Integration (nightly)

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

# A nightly DUT sweep should not pile up; keep only the latest.
concurrency:
  group: integration-nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Pinned to the Matter 1.4 release our v1.0 targets. Tracking `master` broke
  # the sweep silently from 2026-09-12: connectedhomeip #74101 (Groups cluster
  # revision 5, Matter 1.5 soft-deprecation) stubs AddGroup with
  # INVALID_IN_STATE on Groupcast devices, and matter-rust has no Groupcast yet.
  # Bump deliberately, with the 1.5 work, never by following master.
  CHIP_REF: v1.4.2.0

jobs:
  integration:
    name: chip example-app integration sweeps (v1.4.2.0)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout matter-rust
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Checkout connectedhomeip
        uses: actions/checkout@v7
        with:
          repository: project-chip/connectedhomeip
          ref: ${{ env.CHIP_REF }}
          path: connectedhomeip
          submodules: false

      - name: Install connectedhomeip build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ pkg-config ninja-build \
            python3 python3-venv python3-dev python3-pip unzip \
            libssl-dev libdbus-1-dev libglib2.0-dev \
            libgirepository1.0-dev libcairo2-dev libreadline-dev \
            libavahi-client-dev libevent-dev avahi-daemon

      # The ICD step's lit-icd-app is built with the `-platform-mdns` variant
      # (advertises + resolves via avahi). A running avahi-daemon then mediates
      # between chip and the controller's mdns-sd — the role macOS's system
      # mDNSResponder plays locally. Without it, chip's minimal-mDNS resolver
      # never sees the controller's mdns-sd operational advertisement and the
      # ICD Check-In times out resolving us.
      - name: Start avahi-daemon
        run: |
          sudo systemctl unmask avahi-daemon || true
          sudo systemctl start avahi-daemon
          systemctl status avahi-daemon --no-pager | head -5

      - name: Fetch Linux submodules
        working-directory: connectedhomeip
        run: python3 scripts/checkout_submodules.py --shallow --platform linux

      # Pigweed/CIPD env is large; cache it keyed on the connectedhomeip ref and
      # the bootstrap scripts so most nightly runs skip the slow bootstrap.
      - name: Cache pigweed environment
        uses: actions/cache@v6
        with:
          path: connectedhomeip/.environment
          key: chip-env-${{ env.CHIP_REF }}-${{ hashFiles('connectedhomeip/scripts/setup/*', 'connectedhomeip/scripts/bootstrap.sh') }}

      - name: Bootstrap connectedhomeip (pigweed)
        working-directory: connectedhomeip
        run: bash -c "source scripts/bootstrap.sh"

      - name: Run integration sweep (just integration)
        env:
          CHIP_ROOT: ${{ github.workspace }}/connectedhomeip
        run: rm -f target/integration-dut/app.log && just integration

      # Each sweep uploads its own DUT log, straight after it: every sweep's
      # `spawn_dut` truncates target/integration-dut/app.log, so a later sweep
      # would overwrite an earlier failure's log. Each sweep step deletes the
      # log first, so a sweep that fails before launching its DUT (a build
      # failure) uploads nothing rather than the previous sweep's log.
      # `!cancelled()` (not `failure()`): a log is uploaded whether its sweep
      # passed or failed. No sweep has `continue-on-error`, so any failing
      # sweep fails the job; `!cancelled()` on the later sweeps still runs
      # them. The logs hold the chip example apps' public test setup codes.
      - name: Upload DUT log (all-clusters)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dut-app-log-all-clusters
          path: target/integration-dut/app.log
          if-no-files-found: ignore

      # ICD Check-In flow vs lit-icd-app (built `-platform-mdns`, mediated by
      # the avahi-daemon started above so the device can resolve the
      # controller's mdns-sd advertisement). Gating: validated green on the
      # runner 2026-07-08 (run 28954777425, Check-In received + verified).
      - name: Run ICD Check-In sweep (just integration-icd)
        if: ${{ !cancelled() }}
        env:
          CHIP_ROOT: ${{ github.workspace }}/connectedhomeip
        run: rm -f target/integration-dut/app.log && just integration-icd

      - name: Upload DUT log (ICD)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dut-app-log-icd
          path: target/integration-dut/app.log
          if-no-files-found: ignore

      # OTA provider flow vs ota-requestor-app (also `-platform-mdns`: the
      # requestor resolves the controller's provider advertisement, the same
      # direction avahi mediates for ICD). Gating: validated green on the
      # runner 2026-07-09 (run 28990271472, image served + applied).
      - name: Run OTA provider sweep (just integration-ota)
        if: ${{ !cancelled() }}
        env:
          CHIP_ROOT: ${{ github.workspace }}/connectedhomeip
        run: rm -f target/integration-dut/app.log && just integration-ota

      - name: Upload DUT log (OTA)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dut-app-log-ota
          path: target/integration-dut/app.log
          if-no-files-found: ignore

      # Media, TV-platform and Messages clusters vs tv-app (M9-A3 B5/B7):
      # tv-app serves all of them; all-clusters also serves WakeOnLan and
      # LowPower. tv-app does not build on Apple silicon without Rosetta 2, so
      # this is the tv-app tests' only regular run at v1.4.2.0. tv-app runs
      # chip's interactive shell on stdin; the harness keeps the DUT's stdin
      # open.
      - name: Run tv-app sweep (just integration-tv)
        if: ${{ !cancelled() }}
        env:
          CHIP_ROOT: ${{ github.workspace }}/connectedhomeip
        run: rm -f target/integration-dut/app.log && just integration-tv

      - name: Upload DUT log (tv-app)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dut-app-log-tv
          path: target/integration-dut/app.log
          if-no-files-found: ignore
